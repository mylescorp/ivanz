<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/admin/" />
    <title>Pending approval — IvanZ Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/app.css" />
  </head>
  <body>
    <main class="flex min-h-screen items-center justify-center px-4 py-12">
      <div class="w-full max-w-lg text-center">
        <div class="admin-card shadow-panel">
          <div
            class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-full bg-gold/10 text-gold"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-7 w-7"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"
              />
            </svg>
          </div>
          <h1 class="font-heading text-xl font-semibold text-navy">
            Waiting for approval
          </h1>
          <p class="mt-3 text-sm leading-relaxed text-muted">
            Your account is registered but pending Owner approval. You cannot
            access admin pages until an Owner assigns your role and activates
            your account.
          </p>
          <a class="admin-btn-secondary mt-6 inline-flex" href="./login.html">
            Back to sign in
          </a>
        </div>
      </div>
    </main>

    <script src="./js/config.example.js"></script>
    <script src="./js/config.js" onerror=""></script>
    <script src="./js/app.js"></script>
  </body>
</html>
